# Draws the README's picture every hour: my contribution calendar as a lawn, and the dog at today in Seoul's part of
# the day. It fetches the calendar of the weeks it draws (hero/calendar.graphql, with the workflow's own token), draws
# it with hero/render.py (the standard library only, so nothing is installed), and puts what it drew on the output
# branch, which README.md reads, when any of it has changed (the pictures, or the calendar beside them). If the
# calendar does not come or does not check out, nothing is published, and the branch keeps the last pictures.
name: hero

on:
  schedule:
    - cron: "7 * * * *" # every hour, a few minutes after it turns (the queue is busiest on the hour)
  push:
    branches: [main]
    paths: ["hero/**", ".github/workflows/hero.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the renderer
        run: python3 -m unittest discover -s hero -p "test_*.py"

      - name: Fetch the contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the weeks it draws, from a Sunday to now; GitHub's own year, asked for none, does not add up on a Sunday
          span=$(python3 hero/render.py span)
          for try in 1 2 3; do
            gh api graphql -f login="$GITHUB_REPOSITORY_OWNER" -f from="${span% *}" -f to="${span#* }" \
              -F query=@hero/calendar.graphql > "$RUNNER_TEMP/calendar.json" && exit 0
            echo "the calendar did not come (try $try of 3)"
            [ "$try" = 3 ] || sleep 20
          done
          exit 1

      - name: Draw the picture and put it on the output branch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          python3 hero/render.py "$RUNNER_TEMP/calendar.json" auto "$out" 2>&1 >"$RUNNER_TEMP/part" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          part=$(cat "$RUNNER_TEMP/part")

          # the tree as it would be; nothing to push when the branch already holds it
          prev=""
          if git fetch -q --depth=1 origin output 2>/dev/null; then prev=$(git rev-parse 'FETCH_HEAD^{tree}'); fi
          git branch -qD publish 2>/dev/null || true
          git checkout -q --orphan publish
          git read-tree --empty
          git --work-tree="$out" add -A
          tree=$(git write-tree)
          if [ "$tree" = "$prev" ]; then
            echo "Seoul, $part: already on the output branch"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "hero: $part in Seoul"
          git push -q -f origin HEAD:output
          echo "Seoul, $part: published"
